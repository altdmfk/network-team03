{% extends "base.html" %}
{% block title %}로그인 · EngineSquare{% endblock %}
{% block content %}
<main class="page-shell narrow-shell">
  <section class="page-heading">
    <p class="eyebrow">ENGINE SQUARE SECURITY CENTER</p>
    <h1>보안 관제 시작하기</h1>
    <p>아이디와 비밀번호로 로그인하면 보안 화면을 확인할 수 있습니다.</p>
  </section>
  <form class="panel form-panel" method="post">
    <label for="username">아이디</label>
    <input id="username" name="username" type="text" placeholder="아이디를 입력하세요" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
    <button class="button primary" type="submit">로그인</button>
    <p class="auth-link">계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
  </form>
</main>
{% endblock %}
