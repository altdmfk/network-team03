apiVersion: v1
kind: ConfigMap
metadata:
  name: soar-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: soar-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
{{- range $key, $val := .Values.secret }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.pvcName }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
