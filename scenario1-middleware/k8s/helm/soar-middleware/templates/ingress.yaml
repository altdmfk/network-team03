{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soar-ingestor-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: {{ .Values.ingestor.port }}
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: {{ .Values.ingestor.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: {{ .Values.ingestor.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: {{ .Values.ingestor.port }}
{{- end }}
