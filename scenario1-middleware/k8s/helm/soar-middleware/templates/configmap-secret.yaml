apiVersion: v1
kind: ConfigMap
metadata:
  name: soar-config
  namespace: {{ .Release.Namespace }}
data:
{{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: soar-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $val := .Values.secret }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
