{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soar-ingestor-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: ingestor
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ingestor
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics/prometheus
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soar-consumer-worker-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: consumer-worker
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: consumer-worker
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
