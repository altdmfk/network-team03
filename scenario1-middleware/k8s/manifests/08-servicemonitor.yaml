apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soar-ingestor-monitor
  namespace: soar
  labels:
    app: ingestor
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ingestor
  namespaceSelector:
    matchNames:
      - soar
  endpoints:
    - port: http
      path: /metrics/prometheus
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soar-consumer-worker-monitor
  namespace: soar
  labels:
    app: consumer-worker
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: consumer-worker
  namespaceSelector:
    matchNames:
      - soar
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
