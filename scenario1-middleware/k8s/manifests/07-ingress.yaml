apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soar-ingestor-ingress
  namespace: soar
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: 8000
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ingestor
                port:
                  number: 8000
